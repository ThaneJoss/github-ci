# Complete caller: no inputs, environment variables or secrets to configure.
# New runs follow github-ci main; third-party Actions remain pinned to full SHAs.
name: CI
'on':
  push: {}
  pull_request: {}
  merge_group: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  ci:
    uses: ThaneJoss/github-ci/.github/workflows/ci.yml@main
