# INTEGRATION EXAMPLE: new runs follow github-ci main; third-party Actions remain SHA-pinned.
# Copy as .github/workflows/ci.yml and adjust branch, runtime, lockfile and repository scripts.
# Configure only the unique required check name Gate after a successful real GitHub run.
# No event-level path filters; no secrets inheritance; do not conditionally skip jobs.ci.
# Dependency-free plugin only: real behavioral tests plus manifest/archive validation.
# The repository supplies these tests and packaging script; do not invent passing placeholders.
# If any package dependencies are declared, move to the Node profile with a committed lock.
name: CI
'on':
  pull_request: {}
  push:
    branches:
    - main
  workflow_dispatch: {}
  merge_group:
    types:
    - checks_requested
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    name: CI
    uses: ThaneJoss/github-ci/.github/workflows/ci.yml@main
    with:
      profile: docs
      timeout-minutes: 5
      lightweight-node-version: '22'
      docs-command: |-
        node --test tests/*.test.mjs
        python3 scripts/package_plugin.py --check
  gate:
    name: Gate
    if: ${{ always() }}
    needs:
    - ci
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
    - name: Require successful quality completion
      env:
        CI_RESULT: ${{ needs.ci.result }}
        QUALITY_PASSED: ${{ needs.ci.outputs.quality-passed }}
      run: |
        if [[ "$CI_RESULT" != success || "$QUALITY_PASSED" != true ]]; then
          printf 'Quality gate failed: result=%s completed=%s\n' "$CI_RESULT" "$QUALITY_PASSED" >&2
          exit 1
        fi
        printf 'Quality gate passed.\n'
    - name: Reject a cancelled run
      if: ${{ cancelled() }}
      run: |
        exit 1
