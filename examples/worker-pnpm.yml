# INTEGRATION EXAMPLE: pinned to the initial published template commit; review before upgrading.
# Copy as .github/workflows/ci.yml and adjust branch, runtime, lockfile and repository scripts.
# Configure only the unique required check name Gate after a successful real GitHub run.
# No event-level path filters; no secrets inheritance; do not conditionally skip jobs.ci.
# Wrangler must be pinned by the caller lockfile; this dry run does not publish a Worker.
# Pin the pnpm version already used to generate the lockfile; this version is illustrative.
name: CI
'on':
  pull_request: {}
  push:
    branches:
    - main
  workflow_dispatch: {}
  merge_group:
    types:
    - checks_requested
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    name: CI
    uses: ThaneJoss/github-ci/.github/workflows/ci.yml@835d0365f1a05d53f1a3c49fa38d907ee3828093
    with:
      profile: node
      node-version: '22'
      package-manager: pnpm
      package-manager-version: 10.15.1
      lockfile: pnpm-lock.yaml
      lint-command: pnpm run lint
      typecheck-command: pnpm run typecheck
      test-command: pnpm run test:unit
      build-command: pnpm exec wrangler deploy --dry-run --outdir dist
      integration-command: pnpm run test:worker-local
  gate:
    name: Gate
    if: ${{ always() }}
    needs:
    - ci
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
    - name: Require successful quality completion
      env:
        CI_RESULT: ${{ needs.ci.result }}
        QUALITY_PASSED: ${{ needs.ci.outputs.quality-passed }}
      run: |
        if [[ "$CI_RESULT" != success || "$QUALITY_PASSED" != true ]]; then
          printf 'Quality gate failed: result=%s completed=%s\n' "$CI_RESULT" "$QUALITY_PASSED" >&2
          exit 1
        fi
        printf 'Quality gate passed.\n'
    - name: Reject a cancelled run
      if: ${{ cancelled() }}
      run: |
        exit 1
